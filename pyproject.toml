[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment"
version = "1.0.0"
description = "Production-grade sentiment analysis pipeline: ingestion -> labeling -> preprocessing -> features -> training -> evaluation -> serving -> monitoring."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "scikit-learn>=1.6",
    "ftfy>=6.1",
    "emoji>=2.10",
    "vaderSentiment>=3.3.2",
    "pyyaml>=6",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
    "joblib>=1.3",
]

[project.optional-dependencies]
# torch is installed separately from the CPU/GPU index (see scripts/setup.ps1 and Dockerfile).
dl = ["transformers>=4.40", "accelerate>=0.30"]
dense = ["gensim>=4.3"]
tracking = ["mlflow>=2.12"]
monitoring = ["evidently>=0.6"]
nlp = ["spacy>=3.7"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
sentiment = "sentiment.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentiment = ["serving/static/*", "serving/static/swagger/*", "preprocessing/resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
src = ["src"]
