# Single source of truth for every stage. Override the path with SENTIMENT_CONFIG=<file>.
# Sized for: i7-1255U (12 threads), ~16 GB RAM, CPU-only (no CUDA), C: nearly full -> all caches on D:.

project: sentiment
seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  artifacts_dir: artifacts
  reports_dir: reports
  cache_dir: .cache          # HF_HOME / torch / pip caches are forced here (never C:)
  logs_dir: logs

ingest:
  sources:
    - name: sentiment140
      kind: csv
      path: data/raw/sentiment140/training.1600000.processed.noemoticon.csv
      encoding: latin-1          # file is NOT valid utf-8; mojibake is repaired by ftfy in the cleaner
      has_header: false
      columns: [label, id, timestamp, query, author, text]
      label_map: {"0": 0, "4": 1}  # 2 (neutral) -> dropped (unmapped labels are rejected, never coerced)
      label_source: weak         # labels were derived from emoticons (distant supervision)
      sample_size: 120000        # stratified per-label sample; null = use everything (1.6M rows)
    - name: sentiment140_gold
      kind: csv
      path: data/raw/sentiment140/testdata.manual.2009.06.14.csv
      encoding: latin-1
      has_header: false
      columns: [label, id, timestamp, query, author, text]
      label_map: {"0": 0, "4": 1}
      label_source: gold         # human-labelled; used ONLY as an external hold-out
      sample_size: null
  chunk_size: 200000
  timezone_offsets: {UTC: "+0000", GMT: "+0000", PDT: "-0700", PST: "-0800", EDT: "-0400", EST: "-0500"}

stream:
  queue_maxsize: 10000
  flush_size: 500
  flush_interval_s: 2.0
  dedup_window: 200000

preprocess:
  language: en
  max_chars: 5000
  url_token: " httpurl "
  user_token: " @user "
  demojize: true
  fix_mojibake: true
  strip_html: true
  max_char_repeat: 2
  expand_slang: true
  expand_contractions: true
  # Classic (sparse / static-embedding) profile only:
  lowercase: true
  mark_negation: true
  remove_stopwords: true     # negations and intensifiers are ALWAYS kept
  lemmatize: false           # needs spaCy (optional extra); little gain on tweets

split:
  strategy: temporal         # temporal | stratified | group
  val_frac: 0.15
  test_frac: 0.15
  time_col: timestamp
  group_col: author
  drop_eval_groups_seen_in_train: true   # same author in train & test = leakage of writing style
  min_class_frac: 0.10       # fail loudly if a split is (almost) single-class
  # Sentiment140 collection artefact: from 2009-06-17 on the file contains ONLY negative tweets (positive
  # collection stopped). A temporal split over the full range gives a 100%-negative test set (caught by
  # min_class_frac). Restrict to the period where both classes were collected.
  time_window: [null, "2009-06-17"]

train:
  models: [tfidf_logreg]     # what `sentiment pipeline` trains; see `sentiment train --help`
  cv_folds: 3
  search_iter: 8
  n_jobs: 4                  # leaves headroom for the OS on a 12-thread laptop
  class_weight: balanced
  max_features_word: 200000
  max_features_char: 300000
  transformer:
    model_name: distilbert-base-uncased
    max_length: 64           # tweets: p99 is ~45 wordpieces; truncation rate is logged
    train_subsample: 8000    # CPU budget (measured ~3 s/step at bs=32 on the i7-1255U); raise freely on GPU
    eval_subsample: 2000
    epochs: 2                # 500 steps ~ 25 min on this CPU; DON'T run other heavy jobs concurrently (7x slowdown seen)
    batch_size: 32
    learning_rate: 5.0e-5
    weight_decay: 0.01
    warmup_ratio: 0.06
    early_stopping_patience: 1
    torch_threads: 8
  embedding:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    max_length: 64
    batch_size: 128
    train_subsample: 30000
  word2vec:
    vector_size: 200
    window: 5
    min_count: 3
    epochs: 10

evaluate:
  # Business rule: a NEGATIVE text predicted POSITIVE (false positive) is the costly error.
  positive_label: 1
  threshold_strategy: max_fpr   # max_fpr | cost
  max_fpr: 0.05                 # tune threshold on VALIDATION so FPR <= 5%, maximise recall
  cost_fp: 5.0                  # used when threshold_strategy = cost
  cost_fn: 1.0
  bootstrap_samples: 500
  slice_min_support: 50
  slice_fpr_alert_factor: 1.5

registry:
  model_name: sentiment-classifier
  promotion:
    max_test_fpr: 0.06
    min_recall_gain: -0.005     # challenger may be at most 0.5pt worse in recall than champion

tracking:
  enabled: true
  tracking_uri: sqlite:///mlflow.db
  experiment: sentiment

serve:
  model_dir: null               # null -> registry champion
  max_batch_items: 256
  max_text_chars: 5000
  microbatch_max_size: 64
  microbatch_max_wait_ms: 10
  max_queue: 2000
  cache_size: 50000
  cache_ttl_s: 3600
  rate_limit_per_minute: 600
  rate_limit_burst: 100
  job_max_items: 20000
  uncertainty_margin: 0.5       # LOGIT units around the threshold (odds within x1.65 of it); scale-free, unlike a prob. margin
  quantize_transformer: true    # int8 is used only if it passes golden parity (it did NOT for distilbert v5 -> fp32)
  # Hybrid CPUs (i7-1255U = 2 P-cores + 8 E-cores): measured 0.61 s/batch@2 threads vs 1.41 s@8 for DistilBERT.
  # Benchmark per host; on a server CPU set this to the physical cores per replica.
  torch_threads: 2
  log_predictions: true
  log_text: false               # privacy: store hashes + features, not raw text
  strict_fingerprint: true

monitoring:
  window_size: 2000
  min_window: 200
  psi_alert: 0.2
