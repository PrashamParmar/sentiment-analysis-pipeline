groups:
  - name: sentiment-api
    rules:
      - alert: PredictLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(sentiment_http_request_duration_seconds_bucket{route="/v1/predict"}[5m]))) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "p95 /v1/predict latency above 500ms"}

      - alert: ErrorRateHigh
        expr: sum(rate(sentiment_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(sentiment_http_requests_total[5m])), 1e-9) > 0.01
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "more than 1% of requests failing"}

      - alert: LoadShedding
        expr: rate(sentiment_overloaded_total[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "inference queue full - scale out replicas"}

      - alert: DataDrift
        expr: max(sentiment_drift_alert) == 1
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "input/prediction distribution drifted from training reference (PSI > 0.2)"}

      - alert: OOVRateHigh
        expr: sum(rate(sentiment_oov_rate_sum[15m])) / clamp_min(sum(rate(sentiment_oov_rate_count[15m])), 1e-9) > 0.5
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "more than half of tokens unknown to the model - new vocabulary/language? retrain"}

      - alert: PositiveRateShift
        expr: |
          sum(rate(sentiment_predictions_total{label="positive"}[1h])) / clamp_min(sum(rate(sentiment_predictions_total[1h])), 1e-9)
          - sum(rate(sentiment_predictions_total{label="positive"}[1d] offset 1d)) / clamp_min(sum(rate(sentiment_predictions_total[1d] offset 1d)), 1e-9) > 0.15
        for: 30m
        labels: {severity: info}
        annotations: {summary: "share of positive predictions moved >15pts vs yesterday"}
